<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vishal Khan - AI Digital Twin</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --surface-color: #ffffff;
            --text-main: #212529;
            --text-muted: #6c757d;
            --primary: #4f72aa;
            --primary-hover: #3b5680;
            --border-color: #dee2e6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar Styling */
        .sidebar {
            width: 320px;
            background: var(--surface-color);
            border-right: 1px solid var(--border-color);
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .profile-pic {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 3px solid var(--primary);
            margin-bottom: 20px;
            object-fit: cover;
        }
        .name { font-size: 24px; font-weight: 700; color: #1e1e2f; margin-bottom: 8px; }
        .tagline { font-size: 14px; color: var(--text-muted); margin-bottom: 24px; font-weight: 500; }
        .links-container { width: 100%; display: flex; flex-direction: column; gap: 12px; }
        .btn-link {
            display: block;
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn-link:hover { background: var(--primary-hover); }

        /* Main Chat Window */
        .chat-container { flex: 1; display: flex; flex-direction: column; height: 100%; background: var(--bg-color); }
        .chat-messages { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        
        .message { max-width: 75%; padding: 14px 18px; border-radius: 12px; font-size: 15px; line-height: 1.5; }
        .message.assistant { background: var(--surface-color); align-self: flex-start; border: 1px solid var(--border-color); }
        .message.user { background: #343a40; color: white; align-self: flex-end; }

        /* Quick Inquiry Suggestions */
        .suggestions-wrapper { padding: 0 30px; margin-bottom: 10px; }
        .suggestions-title { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
        .suggestions-box { display: flex; gap: 10px; flex-wrap: wrap; }
        .suggestion-chip {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        .suggestion-chip:hover { background: var(--primary); color: white; border-color: var(--primary); }

        /* Chat Input Field */
        .chat-input-area { padding: 20px 30px 30px 30px; display: flex; gap: 12px; }
        .chat-input {
            flex: 1;
            padding: 14px 20px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            background: var(--surface-color);
        }
        .chat-input:focus { border-color: var(--primary); }
        .btn-send {
            padding: 0 24px;
            background: #343a40;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-send:hover { background: var(--primary); }
    </style>
</head>
<body>

    <!-- Sidebar Profile Area -->
    <div class="sidebar">
        <img src="https://github.com/DataScienceVishal.png" class="profile-pic" alt="Vishal Khan">
        <div class="name">Vishal Khan</div>
        <div class="tagline">📍 London, UK | M.Sc AI Student</div>
        <div class="links-container">
            <a href="https://linkedin.com/in/vishalkhandatascience" target="_blank" class="btn-link">🌐 Connect on LinkedIn</a>
            <a href="https://github.com/DataScienceVishal" target="_blank" class="btn-link">💻 Source Code / GitHub</a>
        </div>
    </div>

    <!-- Interface Main Body -->
    <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
            <div class="message assistant">Hey! I'm Vishal's AI Twin running live on GitHub Models. Ask me anything about my data pipelines, deep learning research, or availability!</div>
        </div>

        <div class="suggestions-wrapper">
            <div class="suggestions-title">💡 Quick Inquiries</div>
            <div class="suggestions-box" id="suggestionsBox"></div>
        </div>

        <div class="chat-input-area">
            <input type="text" class="chat-input" id="chatInput" placeholder="Ask my twin a question...">
            <button class="btn-send" id="btnSend">Send</button>
        </div>
    </div>

    <script>
        // REPLACE WITH YOUR PERSONAL PUBLIC HUGGING FACE EMBEDDED OR REVERSE TOKEN SECURE GATEWAY IF EXPOSING CHATBOT DIRECTLY
        // For standard Github Models endpoints directly on static client layers, you can swap with an edge function or basic obfuscated call:
        const API_URL = "https://models.inference.ai.azure.com/chat/completions";
        const GITHUB_TOKEN = "ghp_YOUR_PUBLIC_INFERENCE_TOKEN_HERE"; // Use a fine-grained token with read-only access to models

        const systemPrompt = `You are the 'Digital Twin' of Vishal Khan. Speak confidently in the first person ('I').
Current Context: I live in London, UK, studying M.Sc. in AI & Computer Science at Northeastern University London.
Background Highlights:
- Former Data Engineer at Teleperformance (Migrated database schemas to Databricks; boosted pipeline efficiency by 50%).
- Commercial Executive at Avant Garde (Built ML sales forecasting models with 80-90% accuracy).
- Education: M.Sc Data Science from LJMU, Exec PG from IIIT Bangalore.
- Key Skills: Python, SQL, Azure Data Factory, Databricks, LangChain, Deep Learning (TensorFlow/PyTorch).
Goal: Provide crisp, professional responses to recruiters and prompt them to check out my LinkedIn or set up an interview.`;

        const queryPool = [
            "What are you researching at Northeastern?",
            "Describe your impact at Teleperformance.",
            "What's your experience with Azure?",
            "Show me your machine learning skills.",
            "How can I schedule an interview?"
        ];

        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const btnSend = document.getElementById('btnSend');
        const suggestionsBox = document.getElementById('suggestionsBox');

        function renderPills() {
            suggestionsBox.innerHTML = '';
            const shuffled = [...queryPool].sort(() => 0.5 - Math.random()).slice(0, 3);
            shuffled.forEach(query => {
                const chip = document.createElement('div');
                chip.className = 'suggestion-chip';
                chip.innerText = query;
                chip.onclick = () => { chatInput.value = query; sendMessage(); };
                suggestionsBox.appendChild(chip);
            });
        }

        function appendMessage(role, text) {
            const msg = document.createElement('div');
            msg.className = `message ${role}`;
            msg.innerText = text;
            chatMessages.appendChild(msg);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            appendMessage('user', text);
            chatInput.value = '';

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${GITHUB_TOKEN}`
                    },
                    body: JSON.stringify({
                        model: "meta-llama-3-8b-instruct", // Free model instance available within your GitHub Models gallery
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: text }
                        ],
                        temperature: 0.3,
                        max_tokens: 250
                    })
                });

                const data = await response.json();
                const reply = data.choices[0].message.content;
                appendMessage('assistant', reply);
            } catch (err) {
                appendMessage('assistant', "I'm currently optimizing my backend weights. Let's connect directly on LinkedIn in the sidebar!");
            }
            renderPills();
        }

        btnSend.onclick = sendMessage;
        chatInput.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };
        renderPills();
    </script>
</body>
</html>
